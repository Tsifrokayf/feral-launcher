plugins { id 'com.android.application' }
android {
    namespace 'com.sr3launcher'
    compileSdk 34
    buildFeatures { buildConfig true }
    defaultConfig {
        minSdk 30
        targetSdk 34
        applicationId 'com.sr3.launcher'
        versionCode 21
        versionName '2.1.0'
        buildConfigField 'String', 'REPO', '"feral-launcher"'
    }
    buildTypes { release { minifyEnabled false } }
    lint { checkReleaseBuilds false; abortOnError false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    // Своя подпись: положите ../launcher.jks и задайте KS_PASS. Иначе релиз подписывается отладочным ключом.
    def ksFile = file('../launcher.jks')
    if (ksFile.exists()) {
        signingConfigs { rel { storeFile ksFile; storePassword System.getenv('KS_PASS'); keyAlias 'launcher'; keyPassword System.getenv('KS_PASS') } }
        buildTypes.release.signingConfig = signingConfigs.rel
    } else {
        buildTypes.release.signingConfig = signingConfigs.debug
    }
}
dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
